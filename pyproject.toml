[project]
name = "idlixdownloader2"
version = "2.0.0"
description = "IDLIX downloader with search TUI, browser-free resolution, multi-select batch downloads, and progress bars"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "cloudscraper>=1.2.71",
    "inquirerpy>=0.3.4",
    "rich>=15.0.0",
    "textual>=8.2.8",
]

[project.scripts]
idlixdownloader2 = "idlixdownloader2.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/idlixdownloader2"]

[tool.uv]
package = true
